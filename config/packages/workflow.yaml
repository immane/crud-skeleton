# Workflow definitions for Symfony Workflow component
# - invoice: Payment invoice lifecycle (App\Payment\Entity\Invoice)
# - order:   Trade order lifecycle (App\Trade\Entity\Order) - core customer/payment flow
# - store_order: Store operational fulfillment (App\Store\Entity\StoreOrder)
# Trade and Store lifecycles are decoupled: Trade owns draft->pending->confirmed->paid->fulfilled->completed,
# Store acceptance is tracked via Trade OrderStoreLifecycle projection and gates confirm.

framework:
    workflows:
        # ---------------------------------------------------------------------
        # Invoice: Payment module
        # ---------------------------------------------------------------------
        invoice:
            # State machine for Payment invoices. Marking is stored via Invoice::getStatus()/setStatus().
            # Supports App\Payment\Entity\Invoice only. Initial place is `pending` (invoice created, not yet paid).
            type: 'state_machine'
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Payment\Entity\Invoice
            initial_marking: pending
            places:
                # pending: invoice created, awaiting pay() call. Can start_pay to paying or be cancelled.
                - pending

                # paying: gateway invocation in progress (wallet/wechat/mock). Wallet adjustments (wallet_balance) are applied before this place.
                - paying

                # paid: gateway confirmed via notify or wallet fully adjusted. Trade OrderInvoiceListener will mark order paid.
                - paid

                # failed: gateway reported failure. Can be retried via start_pay or cancelled.
                - failed

                # cancelled: invoice cancelled before paid (order cancelled, timeout, or explicit cancel). Terminal before paid.
                - cancelled

                # partial_refunded: part of the paid amount has been refunded (partial refund flow).
                - partial_refunded

                # refunded: fully refunded, including wallet adjustments reversed via provider refund().
                - refunded
            transitions:
                # start_pay: pending -> paying. Triggered by InvoiceService::pay() when gateway is invoked.
                start_pay:
                    from: pending
                    to: paying

                # mark_paid: pending/paying -> paid. Triggered by successful notify (WeChat/Mock) or wallet gateway markPaid(). Idempotent via outTradeNo.
                mark_paid:
                    from: [pending, paying]
                    to: paid

                # fail: pending/paying -> failed. Triggered by gateway failure or notify with failure code. Allows retry.
                fail:
                    from: [pending, paying]
                    to: failed

                # cancel: pending/paying/failed -> cancelled. Triggered by InvoiceService::cancel() when order is cancelled before paid.
                cancel:
                    from: [pending, paying, failed]
                    to: cancelled

                # partial_refund: paid -> partial_refunded. For partial amount refunds (not used in first-phase full refunds but reserved).
                partial_refund:
                    from: paid
                    to: partial_refunded

                # refund: paid/partial_refunded -> refunded. Triggered by InvoiceService::refund() — first refunds gateway amount, then wallet adjustments.
                refund:
                    from: [paid, partial_refunded]
                    to: refunded

        # ---------------------------------------------------------------------
        # StoreOrder: Store operational fulfillment
        # ---------------------------------------------------------------------
        store_order:
            type: 'state_machine'
            marking_store:
                type: 'method'
                property: 'operationalStatus'
            supports:
                - App\Store\Entity\StoreOrder
            initial_marking: pending_validation
            places:
                - pending_validation
                - awaiting_inventory
                - accepted
                - rejected
                - fulfillment_pending
                - fulfilling
                - fulfilled
                - cancelled
            transitions:
                await_inventory:
                    from: pending_validation
                    to: awaiting_inventory
                accept:
                    from: [pending_validation, awaiting_inventory]
                    to: accepted
                reject:
                    from: [pending_validation, awaiting_inventory]
                    to: rejected
                fulfill:
                    from: [accepted, fulfillment_pending, fulfilling]
                    to: fulfilled
                cancel:
                    from: [pending_validation, awaiting_inventory, accepted, fulfillment_pending, fulfilling]
                    to: cancelled

        # ---------------------------------------------------------------------
        # Order: Trade module - core lifecycle, store acceptance via projection
        # ---------------------------------------------------------------------
        order:
            type: 'state_machine'
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Trade\Entity\Order
            initial_marking: draft
            places:
                # --- Order (core) ---
                # draft: order created in Trade DB, not yet submitted. Can submit to pending.
                - draft

                # pending: submitted, waiting for store acceptance (if store-scoped) then confirm. Can be confirmed to `confirmed`.
                - pending

                # confirmed: order confirmed, ready for payment (Invoice creation). Next is pay -> paid.
                - confirmed

                # paid: payment succeeded (wallet/gateway). Next is fulfill -> fulfilled.
                - paid

                # fulfilled: logistics fulfilled, ready for completion or verification. If StoreSettings.requiresVerification, goes to awaiting_store_verification.
                - fulfilled

                # completed: order completed (either via direct complete or store_verify). Terminal success, can be refunded.
                - completed

                # cancelled: terminal cancelled. Only draft, pending, and confirmed can be cancelled.
                - cancelled

                # refunded: terminal refunded from paid (full refund via Payment). Only paid can go to refunded; no further transitions.
                - refunded

                # --- Store verification (to be eventized in commit 4) ---
                # awaiting_store_verification: fulfilled but requires store verification (StoreSettings.requireVerification=true). Waiting for staff verify via POST /store/{scopeId}/orders/{uuid}/verify.
                - awaiting_store_verification
            transitions:
                # submit: draft -> pending. Local submit; store acceptance now gates confirm via projection, not submit.
                submit:
                    from: draft
                    to: pending

                # confirm: pending -> confirmed. Guarded to require store acceptance (lifecycle) when store-scoped.
                confirm:
                    from: pending
                    to: confirmed

                # pay: confirmed -> paid. Triggered by OrderService::pay() or Payment InvoicePaidEvent (wallet/gateway). Sets paidAt.
                pay:
                    from: confirmed
                    to: paid

                # fulfill: paid -> fulfilled. Triggered by OrderService::fulfill() with tracking/shipping data. Sets fulfilledAt.
                fulfill:
                    from: paid
                    to: fulfilled

                # request_verification: fulfilled -> awaiting_store_verification. Triggered when StoreSettings.requireVerification=true after fulfill. Blocks direct complete.
                request_verification:
                    from: fulfilled
                    to: awaiting_store_verification

                # store_verify: awaiting_store_verification -> completed. Triggered by StoreOrderVerifiedHandler (store.order.verified.v1) after staff verify. Guarded to only allow verified completion.
                store_verify:
                    from: awaiting_store_verification
                    to: completed

                # complete: fulfilled -> completed. Direct completion when verification not required. Trade OrderWorkflowListener sets completedAt via status-driven complete.
                complete:
                    from: fulfilled
                    to: completed

                # cancel: draft/pending/confirmed -> cancelled. Terminal cancellation; triggers inventory release if needed and store cancellation via outbox.
                cancel:
                    from: [draft, pending, confirmed]
                    to: cancelled

                # refund: paid -> refunded. Only paid orders can be refunded. Triggered via OrderService::refund() after Payment refund; fulfilled/completed cannot directly refund.
                refund:
                    from: paid
                    to: refunded
