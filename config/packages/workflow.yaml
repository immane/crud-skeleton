framework:
    workflows:
        invoice:
            type: 'state_machine'
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Payment\Entity\Invoice
            initial_marking: pending
            places:
                - pending
                - paying
                - paid
                - failed
                - cancelled
                - partial_refunded
                - refunded
            transitions:
                start_pay:
                    from: pending
                    to: paying
                mark_paid:
                    from: [pending, paying]
                    to: paid
                fail:
                    from: [pending, paying]
                    to: failed
                cancel:
                    from: [pending, paying, failed]
                    to: cancelled
                partial_refund:
                    from: paid
                    to: partial_refunded
                refund:
                    from: [paid, partial_refunded]
                    to: refunded

        order:
            type: 'state_machine'
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Trade\Entity\Order
            initial_marking: draft
            places:
                # --- Order (core) ---
                - draft
                - pending
                - confirmed
                - paid
                - fulfilled
                - completed
                - cancelled
                - refunded
                # --- Store handoff (acceptance) ---
                - awaiting_store_acceptance
                - store_accepted
                - store_rejected
                # --- Store verification ---
                - awaiting_store_verification
            transitions:
                # --- Order: local submission ---
                submit:
                    from: draft
                    to: pending
                # --- Trade -> Store: handoff for acceptance ---
                store_submit:
                    from: draft
                    to: awaiting_store_acceptance
                store_accept:
                    from: awaiting_store_acceptance
                    to: store_accepted
                store_reject:
                    from: awaiting_store_acceptance
                    to: store_rejected
                # --- Order: confirmation & lifecycle ---
                confirm:
                    from: [pending, store_accepted]
                    to: confirmed
                pay:
                    from: confirmed
                    to: paid
                fulfill:
                    from: paid
                    to: fulfilled
                # --- Store verification ---
                request_verification:
                    from: fulfilled
                    to: awaiting_store_verification
                store_verify:
                    from: awaiting_store_verification
                    to: completed
                complete:
                    from: fulfilled
                    to: completed
                # --- Order: terminal ---
                cancel:
                    from: [draft, pending, awaiting_store_acceptance, store_accepted, store_rejected, confirmed, fulfilled, awaiting_store_verification]
                    to: cancelled
                refund:
                    from: completed
                    to: refunded
